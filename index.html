  <script>
      // دیتای استان‌ها (بر اساس عکس ارسالی شما)
      const salesData = {
          "اردبیل": [0, 0, 1900000, 79800000],

          "کردستان": [0, 7500000, 8000000, 2000000],

          "یزد": [8000000, 4500000, 1000000, 60000000],
        
      };

      const labels = ['۱۴۰۲', '۱۴۰۳', '۱۴۰۴', '۱۴۰۵'];
      let ctx = document.getElementById('revenueChart').getContext('2d');
      let myChart;

      function initChart(province) {
          const data = {
              labels: labels,
              datasets: [{
                  label: 'درآمد (تومان)',
                  data: salesData[province],
                  fill: true,
                  backgroundColor: 'rgba(52, 152, 219, 0.2)',
                  borderColor: 'rgba(52, 152, 219, 1)',
                  borderWidth: 3,
                  tension: 0.4, // برای منحنی شدن خط
                  pointBackgroundColor: 'rgba(44, 62, 80, 1)',
                  pointRadius: 5
              }]
          };

          const config = {
              type: 'line',
              data: data,
              options: {
                  responsive: true,
                  plugins: {
                      legend: {
                          display: true,
                          labels: { font: { family: 'Vazir' } }
                      },
                      tooltip: {
                          bodyFont: { family: 'Vazir' },
                          titleFont: { family: 'Vazir' }
                      }
                  },
                  scales: {
                      y: {
                          beginAtZero: false,
                          ticks: {
                              font: { family: 'Vazir' },
                              callback: function(value) {
                                  return value.toLocaleString() + ' تومان';
                              }
                          }
                      },
                      x: {
                          ticks: { font: { family: 'Vazir' } }
                      }
                  }
              }
          };

          myChart = new Chart(ctx, config);
      }

      function updateChart() {
          const selectedProvince = document.getElementById('provinceSelect').value;
          myChart.data.datasets[0].data = salesData[selectedProvince];
          myChart.update();
      }

      // اجرای اولیه نمودار با هرمزگان
      window.onload = () => {
          initChart('هرمزگان');
